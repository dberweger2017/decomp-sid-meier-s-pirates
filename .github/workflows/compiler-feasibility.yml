name: Historical compiler feasibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'toolchain/**'
      - 'tools/toolchain.py'
      - 'tools/validate_compiler.py'
      - 'tools/historical_smoke.py'
      - '.github/workflows/compiler-feasibility.yml'
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: legacy-cache
        with:
          path: |
            build/toolchain/legacy
            build/toolchain/llvmgcc42-*
            build/toolchain/llvmCore-*
            build/toolchain/cctools-port-*
            build/toolchain/llvmgcc42.tar.gz
            build/toolchain/llvmCore.tar.gz
            build/toolchain/cctools-port.tar.gz
          key: legacy-linux-amd64-${{ hashFiles('toolchain/sources.lock.json', 'toolchain/package-versions.lock') }}-${{ hashFiles('toolchain/build-legacy.sh', 'toolchain/build-assembler.sh') }}
          restore-keys: legacy-linux-amd64-${{ hashFiles('toolchain/sources.lock.json', 'toolchain/package-versions.lock') }}-
      - name: Reproduce pinned Linux source-build experiment
        run: python tools/toolchain.py build
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.legacy-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/toolchain/legacy
            build/toolchain/llvmgcc42-*
            build/toolchain/llvmCore-*
            build/toolchain/cctools-port-*
            build/toolchain/llvmgcc42.tar.gz
            build/toolchain/llvmCore.tar.gz
            build/toolchain/cctools-port.tar.gz
          key: ${{ steps.legacy-cache.outputs.cache-primary-key }}
      - name: Export validated toolchain with source and fingerprints
        id: export-runtime
        run: python tools/toolchain.py export
      - name: Install pinned matching dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify historical incremental matching and deliberate regression
        run: python tools/historical_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.export-runtime.outcome == 'success'
        with:
          name: validated-llvmgcc42-linux-amd64
          path: |
            build/toolchain/runtime-image.tar.gz
            build/toolchain/runtime-export.json
            build/toolchain/compiler.json
            build/toolchain/validation.json
          if-no-files-found: error
      - name: Record compiler validation result
        if: always()
        run: |
          echo '## Historical compiler feasibility' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path('build/toolchain/attempt.json')
          d = json.loads(p.read_text()) if p.exists() else {}
          print('Validated cross-build: **%s**; stage: `%s`.' % (d.get('validated', False), d.get('stage', 'not started')))
          print('Exact equivalence to the app compiler and original flags remain unproven.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-feasibility-diagnostics
          path: |
            build/toolchain/attempt.json
            build/toolchain/environment.log
            build/toolchain/legacy-build.log
            build/toolchain/assembler-build.log
            build/toolchain/runtime-build.log
            build/toolchain/runtime.json
            build/toolchain/compiler.json
            build/toolchain/validation.json
            build/toolchain/probes/**/diagnostics.txt
            build/toolchain/historical-smoke-*.json
          if-no-files-found: warn
