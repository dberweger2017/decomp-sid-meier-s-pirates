name: Historical compiler feasibility (unvalidated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.11'
      - name: Reproduce pinned Linux source-build experiment
        run: python tools/toolchain.py build
      - name: Record validation limitation
        if: always()
        run: |
          echo '## Historical compiler feasibility' >> "$GITHUB_STEP_SUMMARY"
          echo 'An LLVM core build alone does not validate LLVM-GCC ARMv7 Mach-O compilation. Review build logs and pass tools/validate_compiler.py before pinning a runtime image.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compiler-feasibility-diagnostics
          path: |
            build/toolchain/attempt.json
            build/toolchain/environment.log
            build/toolchain/legacy-build.log
          if-no-files-found: warn
