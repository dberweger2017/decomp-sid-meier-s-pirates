name: Build and report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pirates-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: Synthetic tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          cache: pip
      - name: Install hash-pinned tooling
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Parser, relocations, watcher, builds, deterministic reports, and regression tests
        run: python -m unittest discover -v
      - name: Prove deliberate regression fails the CI checker
        shell: bash
        run: |
          if python tools/ci.py demo-regression --output build/ci-demo; then
            echo 'ERROR: deliberate regression was accepted'
            exit 1
          fi
          python -c 'import json; d=json.load(open("build/ci-demo/delta.json")); assert any("Verified match regressed" in x for x in d["failures"])'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-regression-${{ matrix.os }}
          path: |
            build/ci-demo/*.json
            build/ci-demo/summary.md
          if-no-files-found: warn
  game-progress:
    name: ARMv7 inventory and historical candidate progress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          path: base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          cache: pip
          cache-dependency-path: head/requirements.txt
      - name: Install hash-pinned tooling
        run: python -m pip install --require-hashes -r head/requirements.txt
      - name: Obtain one shared verified original input
        shell: bash
        run: |
          mkdir -p inputs
          curl --fail --location --retry 3 'https://archive.org/download/Sid_Meier_s_Pirates__1.1.2_ios_4.2/Sid_Meier_s_Pirates__1.1.2_ios_4.2.ipa' -o inputs/pirates.ipa
          echo '9da0cc5038f14acac0537695a43952a336035d3286ec171a615e6fac9869a048  inputs/pirates.ipa' | sha256sum --check
      - name: Detect historical compilation requirements
        id: candidates
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          units = any(json.loads(p.read_text()).get('units') for p in [Path('base/config/candidates.json'), Path('head/config/candidates.json')] if p.is_file())
          print('present=' + str(units).lower())
          PY
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.candidates.outputs.present == 'true'
        id: candidate-compiler-cache
        with:
          path: |
            head/build/toolchain/legacy
            head/build/toolchain/llvmgcc42-*
            head/build/toolchain/llvmCore-*
            head/build/toolchain/cctools-port-*
            head/build/toolchain/llvmgcc42.tar.gz
            head/build/toolchain/llvmCore.tar.gz
            head/build/toolchain/cctools-port.tar.gz
          key: game-legacy-linux-amd64-${{ hashFiles('head/toolchain/sources.lock.json', 'head/toolchain/package-versions.lock') }}-${{ hashFiles('head/toolchain/build-legacy.sh', 'head/toolchain/build-assembler.sh') }}
          restore-keys: game-legacy-linux-amd64-${{ hashFiles('head/toolchain/sources.lock.json', 'head/toolchain/package-versions.lock') }}-
      - name: Provision and validate historical candidate compiler
        id: compiler-prep
        continue-on-error: true
        working-directory: head
        shell: bash
        run: |
          status=0
          if python -c 'import json,sys; p=json.load(open("config/compiler.json")); sys.exit(0 if p.get("container",{}).get("image") else 1)'; then
            python tools/validate_compiler.py || status=$?
          elif [[ '${{ steps.candidates.outputs.present }}' == 'true' ]]; then
            python tools/toolchain.py build || status=$?
          else
            echo 'No game source candidates configured. Historical cross-build validation runs in the compiler workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/toolchain/compiler.json ]]; then
            echo 'profile=build/toolchain/compiler.json' >> "$GITHUB_OUTPUT"
          else
            echo 'profile=config/compiler.json' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Provision the shared pinned SDK
        id: sdk-prep
        if: steps.candidates.outputs.present == 'true'
        continue-on-error: true
        working-directory: head
        env:
          PIRATES_SDK_PATH: ${{ vars.PIRATES_SDK_PATH }}
        shell: bash
        run: |
          status=0
          if [[ -n "$PIRATES_SDK_PATH" ]]; then
            python tools/sdk.py check --sdk "$PIRATES_SDK_PATH" --pinned || status=$?
            echo "path=$PIRATES_SDK_PATH" >> "$GITHUB_OUTPUT"
          else
            python tools/sdk.py fetch || status=$?
            echo "path=$PWD/build/sdk/iPhoneOS5.1.sdk" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Provision and validate the shared historical Mach-O linker
        id: linker-prep
        continue-on-error: true
        if: steps.candidates.outputs.present == 'true'
        working-directory: head
        env:
          PIRATES_SDK_PATH: ${{ steps.sdk-prep.outputs.path }}
        run: |
          python tools/linker.py build
          python tools/linker.py validate --sdk "$PIRATES_SDK_PATH" --compiler '${{ steps.compiler-prep.outputs.profile }}'
      - name: Incremental base/head builds with one engine, original input and compiler profile
        # Both checkouts receive this exact validated linker profile and SDK.
        shell: bash
        env:
          PIRATES_SDK_PATH: ${{ steps.sdk-prep.outputs.path }}
        run: |
          sdk_args=()
          if [[ -n "$PIRATES_SDK_PATH" ]]; then sdk_args=(--sdk "$PIRATES_SDK_PATH"); fi
          python head/tools/ci.py build --base base --head head --ipa inputs/pirates.ipa --output artifacts --profile '${{ steps.compiler-prep.outputs.profile }}' --validation head/build/toolchain/validation.json "${sdk_args[@]}"
          if [[ '${{ steps.candidates.outputs.present }}' == 'true' && '${{ steps.linker-prep.outcome }}' != 'success' ]]; then
            echo 'Historical linker provisioning failed; see retained reports and linker diagnostics.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Prove real candidate/header regression handling
        if: steps.candidates.outputs.present == 'true'
        shell: bash
        run: |
          python head/tools/first_candidate_smoke.py --workspace head/build/ci-workspaces/head
          cat head/build/ci-workspaces/head/build/candidate-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export read-only browser snapshot from the verified head build
        shell: bash
        env:
          SITE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          stamp=$(git -C head show -s --format=%cI "$SITE_SHA")
          stamp=$(python -c 'import datetime,sys; print(datetime.datetime.fromisoformat(sys.argv[1]).astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$stamp")
          python head/tools/export_site.py --workspace head/build/ci-workspaces/head --output artifacts/site --commit "$SITE_SHA" --updated-at "$stamp" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pirates-site
          path: artifacts/site/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: always() && steps.candidates.outputs.present == 'true' && steps.candidate-compiler-cache.outputs.cache-hit != 'true'
        with:
          path: |
            head/build/toolchain/legacy
            head/build/toolchain/llvmgcc42-*
            head/build/toolchain/llvmCore-*
            head/build/toolchain/cctools-port-*
            head/build/toolchain/llvmgcc42.tar.gz
            head/build/toolchain/llvmCore.tar.gz
            head/build/toolchain/cctools-port.tar.gz
          key: ${{ steps.candidate-compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pirates-progress
          path: |
            artifacts/base/report.json
            artifacts/base/objdiff-report.json
            artifacts/base/build.log
            artifacts/base/diagnostics/
            artifacts/base/linking/
            artifacts/head/report.json
            artifacts/head/objdiff-report.json
            artifacts/head/build.log
            artifacts/head/diagnostics/
            artifacts/head/linking/
            artifacts/delta.json
            artifacts/build-status.json
            artifacts/summary.md
            head/build/ci-workspaces/head/build/candidate-smoke/*.json
            head/build/ci-workspaces/head/build/candidate-smoke/summary.md
            head/build/toolchain/attempt.json
            head/build/toolchain/environment.log
            head/build/toolchain/legacy-build.log
            head/build/toolchain/assembler-build.log
            head/build/toolchain/runtime-build.log
            head/build/linker/*build.log
            head/build/linker/validation.json
            head/build/linker/missing-import.txt
            head/build/linker/probes/**/diagnostics.txt
          if-no-files-found: warn
      - name: Fail on compiler provisioning failure after preserving reports
        if: always() && (steps.compiler-prep.outcome == 'failure' || steps.sdk-prep.outcome == 'failure')
        run: exit 1
  deploy-site:
    name: Publish pirates.davideb.ch
    needs: [tooling, game-progress]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dberweger2017/decomp-sid-meier-s-pirates'
    runs-on: ubuntu-24.04
    environment:
      name: pirates-production
      url: https://pirates.davideb.ch
    concurrency:
      group: pirates-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download this run's published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pirates-site --dir snapshot
      - name: Publish through restricted SSH with a pinned host key
        env:
          PIRATES_DEPLOY_KEY: ${{ secrets.PIRATES_DEPLOY_KEY }}
          PIRATES_DEPLOY_KNOWN_HOSTS: ${{ vars.PIRATES_DEPLOY_KNOWN_HOSTS }}
          PIRATES_DEPLOY_HOST: ${{ vars.PIRATES_DEPLOY_HOST }}
          PIRATES_DEPLOY_USER: ${{ vars.PIRATES_DEPLOY_USER }}
        shell: bash
        run: |
          umask 077
          key="$RUNNER_TEMP/pirates-deploy-key"
          known_hosts="$RUNNER_TEMP/pirates-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          python - "$key" "$known_hosts" <<'PY'
          import os,sys
          from pathlib import Path
          for name,path in zip(('PIRATES_DEPLOY_KEY','PIRATES_DEPLOY_KNOWN_HOSTS'), sys.argv[1:]):
              value = os.environ[name]
              if not value.strip():
                  raise SystemExit('Missing deployment configuration: ' + name)
              Path(path).write_text(value.rstrip() + '\n')
          PY
          python tools/deploy_site.py --site snapshot --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --host "$PIRATES_DEPLOY_HOST" --user "$PIRATES_DEPLOY_USER" --key "$key" --known-hosts "$known_hosts"
          echo "Published [$GITHUB_SHA](https://pirates.davideb.ch) after both platform tests and the historical build succeeded." >> "$GITHUB_STEP_SUMMARY"
